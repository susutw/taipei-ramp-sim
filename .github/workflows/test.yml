name: 測試

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 單元測試
        run: npm test

      - name: 驗證試開任務（不開瀏覽器）
        run: node scripts/check-drivable.mjs

      - name: 安裝 Chromium
        run: npx playwright-core install --with-deps chromium

      - name: 端對端測試
        run: |
          python3 -m http.server 8931 --bind 127.0.0.1 &
          sleep 2
          npm run test:e2e
